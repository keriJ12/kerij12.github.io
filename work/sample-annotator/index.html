<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>布樣標註工具</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=JetBrains+Mono:wght@500&display=swap">
<style>img { max-width: 100%; }</style>
<style>
/* Layout: one-screen workbench — slim toolbar on top, photo fills the rest, a small card pops up next to whatever you just drew. */
:root {
  --bg: #eef0ed;
  --surface: #ffffff;
  --ink: #1d221f;
  --muted: #5c6660;
  --line: #d3d8d3;
  --accent: #23463a;
  --accent-ink: #ffffff;
  --stage: #dfe3de;
  --focus: #2f6fd6;
  --danger: #b3261e;
  --font-ui: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  --font-data: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #161a18; --surface: #212724; --ink: #e8ece9; --muted: #9aa59f; --line: #36403b;
    --accent: #8fc7ae; --accent-ink: #0f1a15; --stage: #0f1311; --focus: #7aa7ff; --danger: #ff8a80;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #161a18; --surface: #212724; --ink: #e8ece9; --muted: #9aa59f; --line: #36403b;
  --accent: #8fc7ae; --accent-ink: #0f1a15; --stage: #0f1311; --focus: #7aa7ff; --danger: #ff8a80;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-ui); font-size: 14px;
  display: flex; flex-direction: column; padding-inline: 16px; padding-block: 12px; box-sizing: border-box; gap: 10px;
  overflow: hidden;
}
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

.bar { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: start; gap: 8px 16px; }
.bar-main, .bar-sub { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; min-width: 0; }
.bar-actions { display: flex; gap: 8px; align-items: center; }
.bar-actions .btn { white-space: nowrap; }
.footer { display: flex; flex-wrap: wrap; justify-content: flex-end; align-items: center; gap: 8px 16px; }   /* export settings + buttons, under the photo */
.bar-sub { justify-content: flex-end; }
.bar-sub .dl + .dl { padding-left: 12px; border-left: 1px solid var(--line); }
.brand { font-weight: 700; font-size: 15px; margin-right: 6px; letter-spacing: .02em; }
.group { display: flex; gap: 2px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 3px; }
.tool { border: 0; background: transparent; border-radius: 7px; padding: 6px 12px; display: inline-flex; align-items: center; gap: 6px; }
.tool[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.tool:disabled { opacity: .4; cursor: default; }
.tool svg { width: 16px; height: 16px; flex: none; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 7px 14px; display: inline-flex; gap: 6px; align-items: center; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 700; }
.btn:disabled { opacity: .45; cursor: default; }
.btn[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.spacer { flex: 1; }
.dl { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.dl .cap { font-size: 12px; color: var(--muted); }
.dl select, .dl input { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; }
.dl input { width: 90px; font-variant-numeric: tabular-nums; }
.dl input.fname { width: 220px; max-width: 60vw; }
.meta { font-family: var(--font-data); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }

.stage {
  flex: 1; min-height: 0; position: relative; border-radius: 12px; background: var(--stage);
  display: grid; place-items: center; overflow: hidden;
}
.stage.cropping { padding-bottom: 72px; box-sizing: border-box; }
.stage.drag { outline: 3px dashed var(--accent); outline-offset: -8px; }
canvas { display: block; touch-action: none; box-shadow: 0 1px 3px rgba(0,0,0,.18); }
.notice {
  position: absolute; left: 12px; top: 12px; background: var(--surface); border: 1px solid var(--line);
  border-radius: 8px; padding: 6px 10px; font-size: 13px; color: var(--muted); max-width: calc(100% - 24px);
  pointer-events: none;
}
.notice b { color: var(--ink); }

.pop {
  position: absolute; z-index: 5; width: 300px; max-width: calc(100% - 24px); background: var(--surface); color: var(--ink);
  border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 8px 28px rgba(0,0,0,.22);
  padding: 12px; display: flex; flex-direction: column; gap: 10px;
}
.pop label.cap { font-size: 12px; color: var(--muted); }
.pop input[type=text] {
  width: 100%; box-sizing: border-box; font: 500 15px var(--font-ui); padding: 8px 10px;
  border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink);
}
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); background: var(--bg); border-radius: 999px; padding: 4px 10px; font-size: 12.5px; font-variant-numeric: tabular-nums; }
.chip:hover { border-color: var(--accent); }
.chips.arrows { gap: 3px; flex-wrap: nowrap; }
.arrows .chip { font-size: 14px; line-height: 1.2; padding: 2px 0; min-width: 0; flex: 1 1 0; font-family: "Segoe UI Symbol", "Noto Sans Symbols 2", "Source Sans 3", sans-serif; }
#presets .chip { background: var(--surface); }
.row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.seg { display: flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; background: transparent; padding: 5px 10px; font-size: 13px; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.sw { width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--surface); box-shadow: 0 0 0 1px var(--line); padding: 0; }
.sw[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--ink); }
.sw-custom { position: relative; display: inline-block; overflow: hidden; cursor: pointer; box-sizing: border-box;
  background: conic-gradient(#e53935, #fdd835, #43a047, #1e88e5, #8e24aa, #e53935); }
.sw-custom.on { box-shadow: 0 0 0 2px var(--ink); }
.sw-custom input { position: absolute; inset: -4px; width: calc(100% + 8px); height: calc(100% + 8px); opacity: 0; cursor: pointer; border: 0; padding: 0; }
.bgsw { width: 28px; height: 24px; border-radius: 6px; border: 1px solid var(--line); padding: 0; font-size: 11px; font-weight: 700; display: grid; place-items: center; }
.bgsw[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--ink); }
.bgsw.none { background: repeating-conic-gradient(#c9cdc9 0 25%, #ffffff 0 50%) 0 0 / 10px 10px; color: #1d221f; }
.alpha { display: flex; align-items: center; gap: 8px; width: 100%; }
.alpha input[type=range] { flex: 1; min-width: 0; accent-color: var(--accent); }
.alpha output { font-family: var(--font-data); font-size: 12px; color: var(--muted); width: 40px; text-align: right; font-variant-numeric: tabular-nums; }
.alpha.off { opacity: .4; pointer-events: none; }
.pop .actions { display: flex; justify-content: space-between; gap: 8px; align-items: center; }
.actions-right { display: flex; gap: 8px; }
.same { border: 1px solid var(--line); background: var(--bg); border-radius: 999px; padding: 3px 10px; font-size: 12.5px; }
.same[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.link-toggle { font-size: 12px; color: var(--muted); display: inline-flex; align-items: center; gap: 4px; margin-left: auto; cursor: pointer; }
.link-toggle input { accent-color: var(--accent); margin: 0; }
.link-danger { border: 1px solid var(--danger); background: var(--surface); color: var(--danger); padding: 6px 12px; border-radius: 10px; display: inline-flex; align-items: center; gap: 6px; font-weight: 600; }
.link-danger:hover { background: var(--danger); color: var(--surface); }

.cropbar {
  position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%); z-index: 6;
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: center;
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 8px 10px; width: max-content;
  box-shadow: 0 8px 28px rgba(0,0,0,.22); max-width: calc(100% - 24px);
}
.overlay { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: grid; place-items: center; z-index: 10; padding: 16px; }
.overlay .card { background: var(--surface); border-radius: 12px; padding: 14px; max-width: min(900px, 100%); max-height: 100%; display: flex; flex-direction: column; gap: 10px; }
.overlay img { max-height: 70vh; object-fit: contain; }
.toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 8px 14px; border-radius: 8px; font-size: 13px; z-index: 20; }

@media (max-width: 1000px) { .brand { display: none; } }
@media (max-width: 640px) {
  .brand { display: none; }
  .tool span { display: none; }
  .dl .cap { display: none; }
  .pop { left: 8px !important; right: 8px; top: auto !important; bottom: 8px; width: auto; }
}
@media (prefers-reduced-motion: no-preference) { .pop { animation: in .12s ease-out; } @keyframes in { from { opacity: .4; transform: translateY(4px); } } }
</style>
<style>
/* portfolio bar: first flex child of the body, pulled out to the edges with negative margins so the tool's own layout is untouched */
.pf-bar { flex: none; display: flex; justify-content: space-between; align-items: center; gap: 12px; margin: -12px -16px 0; padding: 8px 16px; font-size: 12px; line-height: 1.3; background: var(--line); color: var(--muted); }
.pf-bar a { color: var(--ink); text-decoration: none; white-space: nowrap; }
.pf-bar a:hover, .pf-bar a:focus-visible { text-decoration: underline; }
</style>
</head>
<body>
<div class="pf-bar"><span>布樣標註工具 · 作品集示範</span><a href="../../index.html">← 作品集</a></div>
<div class="bar">
  <div class="bar-main">
  <div class="brand">布樣標註</div>
  <button class="btn" id="openBtn" type="button">
    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 16v3h16v-3M12 4v11M7 9l5-5 5 5"/></svg>開啟照片
  </button>
  <input type="file" id="file" accept="image/*" hidden>
  <div class="group" role="group" aria-label="工具">
    <button class="tool" id="t-rect" data-tool="rect" aria-pressed="true" type="button" title="拖曳畫方框 (B)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="6" width="16" height="12" rx="1"/></svg><span>方框</span></button>
    <button class="tool" id="t-ellipse" data-tool="ellipse" aria-pressed="false" type="button" title="拖曳畫圈圈 (C)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><ellipse cx="12" cy="12" rx="8" ry="6"/></svg><span>圈圈</span></button>
    <button class="tool" id="t-none" data-tool="none" aria-pressed="false" type="button" title="點一下放文字 (T)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 6h14M12 6v13"/></svg><span>文字</span></button>
  </div>
  <div class="group" role="group" aria-label="旋轉">
    <button class="tool" id="rotL" type="button" title="向左轉 (Shift+R)" aria-label="向左轉">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="10" width="11" height="11" rx="1.5"/><path d="M20 14V9a5 5 0 0 0-5-5h-5"/><path d="M13 1l-3 3 3 3"/></svg><span>90°</span></button>
    <button class="tool" id="rotR" type="button" title="向右轉 (R)" aria-label="向右轉">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="10" y="10" width="11" height="11" rx="1.5"/><path d="M4 14V9a5 5 0 0 1 5-5h5"/><path d="M11 1l3 3-3 3"/></svg><span>90°</span></button>
  </div>
  <button class="btn" id="cropBtn" type="button" title="裁切 (K)">
    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2v16h16"/><path d="M2 6h16v16"/></svg>裁切
  </button>
  <div class="group" role="group" aria-label="步驟">
    <button class="tool" id="undoBtn" type="button" title="上一步 (Ctrl+Z)" disabled>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 010 12h-3"/></svg><span>上一步</span></button>
    <button class="tool" id="redoBtn" type="button" title="下一步 (Ctrl+Y)" disabled>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 14l5-5-5-5"/><path d="M20 9H10a6 6 0 000 12h3"/></svg><span>下一步</span></button>
  </div>
  </div>
</div>

<div class="stage" id="stage">
  <canvas id="cv" aria-label="照片與標註"></canvas>
  <div class="notice" id="notice"><b>範例照片</b>：拖一張照片進來、貼上，或按「開啟照片」。在照片上拖曳畫框，放開後選文字。</div>
  <div class="cropbar" id="cropBar" hidden>
    <span class="meta" id="cropInfo"></span>
    <button type="button" class="btn" id="cropReset">還原原圖</button>
    <button type="button" class="btn" id="cropCancel">取消</button>
    <button type="button" class="btn primary" id="cropApply">套用裁切</button>
  </div>
  <div class="pop" id="pop" hidden>
    <div>
      <label class="cap" for="labelText">文字</label>
      <input type="text" id="labelText" placeholder="例如 09.10.2026 – DHL" autocomplete="off">
    </div>
    <div class="chips" id="presets"></div>
    <div class="chips arrows" id="arrows"></div>
    <div class="row">
      <div class="seg" id="shapeSeg" role="group" aria-label="形狀">
        <button type="button" data-shape="rect">方框</button>
        <button type="button" data-shape="ellipse">圈圈</button>
        <button type="button" data-shape="none">只有文字</button>
      </div>
    </div>
    <div class="alpha" id="fsRow">
      <label class="cap" for="fontSize">字體大小</label>
      <input type="range" id="fontSize" min="8" max="150" step="1" value="32">
      <input type="number" id="fontSizeNum" min="8" max="150" step="1" value="32" aria-label="字體大小數值" style="width:56px;font:inherit;padding:3px 6px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink)">
    </div>
    <div class="alpha" id="strokeRow">
      <label class="cap" for="strokeW">框線粗細</label>
      <input type="range" id="strokeW" min="1" max="20" step="1" value="5">
      <output id="strokeOut" for="strokeW">5</output>
    </div>
    <div class="colorblock">
      <label class="cap">字的顏色</label>
      <div class="row" id="colors" role="group" aria-label="字的顏色" style="margin-top:4px"></div>
      <div id="frameRow" style="margin-top:8px"><label class="cap">框的顏色</label>
        <div class="row" id="frameColors" role="group" aria-label="框的顏色" style="margin-top:4px"><button type="button" class="same" id="frameSame">跟字一樣</button></div>
      </div>
    </div>
    <div id="bgRow">
      <label class="cap">底色</label>
      <div class="row" id="bgs" role="group" aria-label="底色" style="margin-top:4px"></div>
    </div>
    <div class="row">
      <label class="cap">文字邊線</label>
      <div class="seg" id="haloSeg" role="group" aria-label="文字邊線">
        <button type="button" data-halo="off">無</button>
        <button type="button" data-halo="white">白邊</button>
        <button type="button" data-halo="black">黑邊</button>
      </div>
    </div>
    <div class="alpha" id="alphaRow">
      <label class="cap" for="bgAlpha">底色透明度</label>
      <input type="range" id="bgAlpha" min="0" max="100" step="5" value="100">
      <output id="alphaOut" for="bgAlpha">100%</output>
    </div>
    <div class="actions">
      <button type="button" class="link-danger" id="delBtn" title="Delete"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg>刪除</button>
      <span class="actions-right"><button type="button" class="btn" id="dupBtn" title="Ctrl+D"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a1 1 0 00-1-1H5a1 1 0 00-1 1v10a1 1 0 001 1h3"/></svg>複製標籤</button>
      <button type="button" class="btn primary" id="doneBtn">完成</button></span>
    </div>
  </div>
</div>

<div class="footer">
  <div class="bar-sub">
  <div class="dl">
    <label class="cap" for="outSize">下載大小</label>
    <select id="outSize">
      <option value="1">原尺寸</option>
      <option value="0.75">75%</option>
      <option value="0.5">50%</option>
      <option value="0.25">25%</option>
      <option value="L1920">長邊 1920 px</option>
      <option value="L1280">長邊 1280 px</option>
      <option value="L800">長邊 800 px</option>
      <option value="custom">自訂寬度…</option>
    </select>
    <input type="number" id="customW" min="50" step="10" placeholder="寬度 px" hidden>
    <span class="meta" id="meta"></span>
  </div>
  <div class="dl">
    <label class="cap" for="fileName">檔名</label>
    <input type="text" id="fileName" class="fname" autocomplete="off" spellcheck="false" title="下載的檔名，副檔名會自動加上">
    <span class="meta" id="fileExt">.jpg</span>
  </div>
  <div class="dl">
    <label class="cap" for="mailSize">複製到郵件的大小</label>
    <select id="mailSize" title="複製到郵件時用的照片大小">
      <option value="L800">長邊 800 px</option>
      <option value="L1280">長邊 1280 px</option>
      <option value="L1920">長邊 1920 px</option>
      <option value="1">原尺寸</option>
    </select>
  </div>
  </div>
  <div class="bar-actions">
  <button class="btn" id="copyBtn" type="button" title="複製後到 Outlook 新郵件按 Ctrl+V">
    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>複製到郵件
  </button>
  <button class="btn primary" id="saveBtn" type="button" title="Ctrl+S">下載</button>
  </div>
</div>
<script>
(() => {
  const COLORS = [
    { id: "red", hex: "#D4051A", name: "紅" },
    { id: "blue", hex: "#0046A0", name: "藍" },
    { id: "green", hex: "#1E7B3A", name: "綠" },
    { id: "orange", hex: "#C85E00", name: "橘" },
    { id: "black", hex: "#1A1A1A", name: "黑" },
    { id: "white", hex: "#FFFFFF", name: "白" },
  ];
  const hexOf = (id) => (id && id[0] === "#") ? id.toUpperCase() : (COLORS.find((c) => c.id === id) || COLORS[0]).hex;   // presets by id, custom colours as #RRGGBB
  const BGS = [
    { id: "white", fill: "#ffffff", name: "白底" },
    { id: "yellow", fill: "#FFE14D", name: "黃底" },
    { id: "black", fill: "#111111", name: "黑底" },
    { id: "color", fill: null, name: "跟文字同色（白字）" },
    { id: "none", fill: null, name: "無底色" },
  ];
  const SIZE = { s: 22, m: 32, l: 46 };       // label font, in 1/1000 of the photo's long edge
  const STROKE = { s: 3, m: 5, l: 7 };

  const $ = (id) => document.getElementById(id);
  const stage = $("stage"), cv = $("cv"), ctx = cv.getContext("2d"), pop = $("pop");
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
  };

  let img = null, img0 = null, rot = 0, imgName = "sample", imgType = "image/jpeg";   // img0 = photo as loaded, img = turned by rot × 90°
  let W = 0, H = 0, base = 1, scale = 1, dpr = 1;
  let anns = [], sel = -1, tool = "rect";
  let history = [], future = [];
  let crop = null, cropMode = false, cropDraft = null, cropBefore = null, cropDrag = null;
  // what the canvas shows: the whole photo while cropping, otherwise the applied crop

    document.body.appendChild(ov);
  }
  $("saveBtn").addEventListener("click", save);

  let tt;
  function toast(msg) {
    let t = document.querySelector(".toast");
    if (!t) { t = document.createElement("div"); t.className = "toast"; t.setAttribute("role", "status"); document.body.appendChild(t); }
    t.textContent = msg; clearTimeout(tt); tt = setTimeout(() => t.remove(), 2600);
  }

  // ---------- start ----------
  const sample = makeSample();
  loadImage(sample.src, "範例", "image/jpeg", true);
  document.fonts?.ready.then(render);
})();
</script>
